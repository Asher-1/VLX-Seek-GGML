version: '3'
services:
  seek-dev:
    image: registry.linker.cc/vlx/vlx-seek:base
    command: sleep 100000000000
    ports:
      - '1233:8000'
    volumes:
      - ./:/workspace
    shm_size: 40gb
    container_name: seek-dev
    restart: always
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            capabilities: [gpu]
            device_ids: ['1']
